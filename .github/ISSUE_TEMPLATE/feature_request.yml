name: Feature request
description: Propose a change to behaviour or a new capability
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        If this has security implications — unauthorized access, wallet or profile takeover, payment redirection, signature bypass, or contract exploitation — **do not file it publicly.** Use the private reporting process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or system problem does this solve? Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Proposed behaviour
      description: What should happen? Describe observable behaviour.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that makes it unambiguous when this is done.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Identity registry
        - Username
        - Wallet linking
        - Resolver
        - SDK
        - Stroopy
        - Passport integration
        - Payments
        - Contracts
        - Web
        - Docs
        - Infrastructure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and privacy considerations
      description: Authorization, network separation, user data, abuse. Write "none" if genuinely none.
    validations:
      required: true
