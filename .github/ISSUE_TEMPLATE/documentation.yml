name: Documentation issue
description: Report something unclear, missing, or wrong in the documentation
labels: ["type:docs"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Page, file, or URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
